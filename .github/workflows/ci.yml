name: Tests only (Ubuntu, 5 min)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests-ubuntu-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/CMakeLists.txt','**/*.cpp','**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install minimal build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache pkg-config

      - name: Install and build system GoogleTest (fast)
        run: |
          # libgtest-dev provides sources; build & install the libs so find_package(GTest) can find them
          sudo apt-get install -y libgtest-dev
          # Debian/Ubuntu may place sources in /usr/src/googletest or /usr/src/gtest
          if [ -d /usr/src/googletest ]; then
            SRC=/usr/src/googletest
          else
            SRC=/usr/src/gtest
          fi
          sudo cmake -S "$SRC" -B "$SRC/build" -DCMAKE_BUILD_TYPE=Release
          sudo cmake --build "$SRC/build" --target install -- -j $(nproc)

      - name: Configure CMake (only tests)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build only pacman_tests target
        run: |
          cmake --build build --target pacman_tests -- -j $(nproc)

      - name: Run tests (only pacman_tests)
        run: |
          ./build/pacman_tests