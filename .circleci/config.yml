version: 2.1
jobs:
  build:
    docker:
      - image: cimg/gcc:11.4.0 # A docker image with gcc and cmake
    steps:
      - checkout # Checks out your code
      - run:
          name: "Build and Run"
          command: |
            mkdir build
            cd build
            cmake ..
            make
            ./Pacman
workflows:
  build-and-run:
    jobs:
      - build