version: 2.1
jobs:
  build:
    docker:
      - image: ubuntu:22.04 # Use a base Ubuntu image
    steps:
      - checkout # Checks out your code
      - run:
          name: "Install Dependencies"
          command: |
            apt-get update
            # DEBIAN_FRONTEND=noninteractive is used to prevent installers from prompting for input
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake
      - run:
          name: "Build and Run"
          command: |
            mkdir -p build
            cd build
            cmake ..
            make
            ./Pacman
workflows:
  build-and-run:
    jobs:
      - build