version: 2.1
jobs:
  build:
    docker:
      - image: ubuntu:22.04 # Use a base Ubuntu image
    steps:
      - checkout # Checks out your code
      - run:
          name: "Install Dependencies"
          command: |
            apt-get update
            # Install prerequisites for building, SFML, GTest, xvfb, and adding the CMake repo
            apt-get install -y \
                build-essential wget gpg libgtest-dev \
                libgl1-mesa-dev libxrandr-dev libx11-dev libxcursor-dev \
                libudev-dev libopenal-dev libflac-dev libvorbis-dev libegl1-mesa-dev \
                libfreetype6-dev xvfb # Added xvfb for virtual display

            # Add Kitware's APT repository to get a newer version of CMake
            wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc | gpg --dearmor -o /usr/share/keyrings/kitware-archive-keyring.gpg
            echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ jammy main' | tee /etc/apt/sources.list.d/kitware.list >/dev/null
            
            # Update package list again and install cmake
            apt-get update
            apt-get install -y cmake

            # --- Build and Install SFML 2.6.1 from source ---
            SFML_VERSION="2.6.1"
            wget https://github.com/SFML/SFML/archive/refs/tags/${SFML_VERSION}.tar.gz
            tar -xzf ${SFML_VERSION}.tar.gz
            cd SFML-${SFML_VERSION}
            cmake .
            make -j$(nproc)
            make install
            # Refresh the shared library cache
            ldconfig
            cd ..
      - run:
          name: "Build and Run"
          command: |
            mkdir -p build
            cd build
            cmake ..
            make
            # Run the executable inside a virtual display for 5 seconds, then stop it.
            # This confirms it launches without crashing and then allows the CI job to finish.
            xvfb-run timeout 5s ./pacman
workflows:
  build-and-run:
    jobs:
      - build