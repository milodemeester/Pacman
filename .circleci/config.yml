version: 2.1

jobs:
  # --- JOB 1: Build Logic Only (Fast, No SFML) ---
  build_logic_standalone:
    docker:
      - image: ubuntu:22.04
    steps:
      - checkout
      - run:
          name: "Install Build Tools & Updated CMake"
          command: |
            apt-get update
            apt-get install -y build-essential wget gpg

            # --- Install CMake 3.28+ via Kitware repo ---
            wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc | gpg --dearmor -o /usr/share/keyrings/kitware-archive-keyring.gpg
            echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ jammy main' | tee /etc/apt/sources.list.d/kitware.list >/dev/null
            
            apt-get update
            apt-get install -y cmake

      - run:
          name: "Build Logic Library"
          command: |
            mkdir -p build-logic
            cd build-logic
            # This will now use the new CMake version
            cmake -S ../Logic -B . -DCMAKE_BUILD_TYPE=Debug
            make

  # --- JOB 2: Build Full Game (Slow, With SFML) ---
  build_game_sfml:
    docker:
      - image: ubuntu:22.04
    steps:
      - checkout
      - restore_cache:
          keys:
            - sfml-build-2.6.1-v1
      - run:
          name: "Install Dependencies & Updated CMake"
          command: |
            apt-get update
            apt-get install -y \
                build-essential wget gpg \
                libgl1-mesa-dev libxrandr-dev libx11-dev libxcursor-dev \
                libudev-dev libopenal-dev libflac-dev libvorbis-dev libegl1-mesa-dev \
                libfreetype6-dev xvfb

            # --- Install CMake 3.28+ via Kitware repo ---
            wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc | gpg --dearmor -o /usr/share/keyrings/kitware-archive-keyring.gpg
            echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ jammy main' | tee /etc/apt/sources.list.d/kitware.list >/dev/null
            
            apt-get update
            apt-get install -y cmake

      - run:
          name: "Build and Install SFML"
          command: |
            SFML_VERSION="2.6.1"
            if [ ! -d "SFML-${SFML_VERSION}" ]; then
                wget https://github.com/SFML/SFML/archive/refs/tags/${SFML_VERSION}.tar.gz
                tar -xzf ${SFML_VERSION}.tar.gz
                cd SFML-${SFML_VERSION}
                cmake .
                make -j$(nproc)
                cd ..
            fi
            cd SFML-${SFML_VERSION}
            make install
            ldconfig

      - save_cache:
          paths:
            - SFML-2.6.1
          key: sfml-build-2.6.1-v1

      - run:
          name: "Build and Run Game"
          command: |
            mkdir -p build
            cd build
            cmake ..
            make -j$(nproc)
            xvfb-run timeout 5s ./pacman || if [ $? = 124 ]; then exit 0; else exit $?; fi

workflows:
  version: 2
  build_all:
    jobs:
      - build_logic_standalone
      - build_game_sfml